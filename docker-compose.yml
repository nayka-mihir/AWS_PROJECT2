version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ecom_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
    restart: always

  frontend:
    build: ./frontend
    container_name: ecom_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always