services:
  # Single container: Express serves both API + React frontend on port 5000
  app:
    image: mihirnayka/two-tier-ecom-app:latest
    container_name: ecom_app
    ports:
      - "5000:5000"
    volumes:
      - ecom_data:/app/backend/data    # Persist db.json data across container restarts
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ecom_data:
    driver: local